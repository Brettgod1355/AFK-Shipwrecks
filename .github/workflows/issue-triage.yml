# Helper-Bot issue triage (https://github.com/Brettgod1355/Helper-Bot). Test mode until dry_run is false.
name: Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 * * * *" # hourly: the issue author's 👍 / 👎 on the bot's answer
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to triage (0 = check reactions)
        type: number
        default: 0

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number || 'reactions' }}

jobs:
  triage:
    # Comments only matter when the issue's author replies on an open issue the bot answered as a setting;
    # anything else is filtered out here, before a runner starts.
    if: >-
      github.event_name != 'issue_comment' || (
        !github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.comment.user.login == github.event.issue.user.login &&
        contains(github.event.issue.labels.*.name, 'setting'))
    uses: Brettgod1355/Helper-Bot/.github/workflows/issue-triage.yml@main
    with:
      issue_number: ${{ inputs.issue_number || 0 }}
      dry_run: true          # false = post replies and change labels
      maintainer: BrettG     # how the bot names you: "I'm BrettG's helper bot"
      max_issues_per_day: 10 # new issues answered per 24 hours; the rest wait for you
      bug_tip: ""            # optional Markdown added to bug replies
      app_client_id: ${{ vars.BOT_APP_CLIENT_ID }}   # empty = post as github-actions[bot]
    secrets:
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      issues: write
      id-token: write # lets Helper-Bot reach Claude by workload identity federation; no API key
