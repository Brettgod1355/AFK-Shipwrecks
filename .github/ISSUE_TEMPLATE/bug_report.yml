name: Bug report
description: Something in AFK Shipwrecks doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the form you fill in, the quicker it can be fixed.
        Before posting a screenshot, please crop out other players' names and chat.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Hold count or timer
        - Full-hold alert or banner
        - Hook reminders or where-to-click boxes
        - Parking and double spots
        - Wreck markers and timers
        - Inventory sorting boxes
        - Next step highlight (station, hold or hook)
        - Sidebar panel (spots, routes, docks)
        - Overlay
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: The overlay said the hold was full, but the crew kept bringing salvage in.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen?
      description: The steps that lead to it, if you know them. "It happens sometimes" is fine too.
      placeholder: |
        1. Park at a double spot with two crewmates on the hooks
        2. Open the cargo hold and close it
        3. ...
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown next to AFK Shipwrecks in RuneLite's Plugin Hub list.
      placeholder: "2.2"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: Any AFK Shipwrecks settings you changed from their defaults that might matter.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a clip
      description: Drag images or a short video here. Please crop out other players' names and chat.
